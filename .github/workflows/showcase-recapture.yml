# Temporary, branch-only recapture. Remove after the four PNGs are committed.
name: One-off synthetic showcase recapture
on:
  push:
    branches: [fix/tracker-scope-stale-scores-showcase]
    paths:
      - .github/workflows/showcase-recapture.yml
      - scripts/capture_showcase_screenshots.py

permissions:
  contents: write

jobs:
  recapture:
    runs-on: ubuntu-24.04
    env:
      GEMINI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      CAREERPILOT_SHOWCASE_LIVE: "0"
    steps:
      - name: Checkout synthetic capture branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install isolated screenshot dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium
          npm ci --prefix frontend
      - name: Seed brand-new isolated synthetic data
        run: |
          set -euo pipefail
          DB="$RUNNER_TEMP/careerpilot-showcase/showcase.sqlite"
          mkdir -p "$(dirname "$DB")"
          test ! -e "$DB"
          python scripts/seed_showcase_demo.py --database "$DB" > "$RUNNER_TEMP/showcase-seed.out"
          echo "DATABASE_URL=sqlite:///$DB" >> "$GITHUB_ENV"
      - name: Capture the actual product UI
        run: |
          set -euo pipefail
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/showcase-api.log" 2>&1 &
          API_PID=$!
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 5173 > "$RUNNER_TEMP/showcase-ui.log" 2>&1 &
          UI_PID=$!
          trap 'kill "$API_PID" "$UI_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null && curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health > /dev/null
          python scripts/capture_showcase_screenshots.py --base-url http://127.0.0.1:5173 --out docs/showcase/screenshots
      - name: Commit only the four corrected synthetic screenshots
        run: |
          set -euo pipefail
          git add -- docs/showcase/screenshots/03-discover.png docs/showcase/screenshots/04-match-evidence.png docs/showcase/screenshots/06-track.png docs/showcase/screenshots/06b-analytics.png
          if git diff --cached --quiet; then
            echo "Synthetic screenshots unchanged."
            exit 0
          fi
          git -c user.name='CareerPilot showcase capture' -c user.email='showcase-capture@users.noreply.github.com' commit -m 'docs: recapture synthetic showcase after tracker and evidence fixes [skip ci]'
          # Other regression fixes may have landed while Chromium captured;
          # replay this image-only commit onto the latest PR head.
          git fetch origin fix/tracker-scope-stale-scores-showcase
          git rebase origin/fix/tracker-scope-stale-scores-showcase
          git push origin HEAD:fix/tracker-scope-stale-scores-showcase
