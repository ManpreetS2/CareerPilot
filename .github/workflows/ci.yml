name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      GEMINI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            browser-extension/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        # ubuntu-24.04 hosted runners already provide the system libraries these
        # browser gates need. Install Playwright's bundled Chromium without
        # mutating apt sources; the MVP / Job Intelligence / CORS browser steps
        # below prove the browser launches.
        run: |
          python -m playwright --version
          python -m playwright install chromium

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install browser-extension dependencies
        working-directory: browser-extension
        run: npm ci

      - name: Build browser extension
        working-directory: browser-extension
        run: npm run build

      - name: Browser extension typecheck
        working-directory: browser-extension
        run: npm run typecheck

      - name: Browser extension tests
        working-directory: browser-extension
        # A non-UTC zone on purpose: the panel renders naive UTC timestamps
        # from the backend, and running these only under the runner's default
        # UTC would hide exactly the local-time parsing bug they cover.
        env:
          TZ: Asia/Kolkata
        run: npm test

      - name: Run backend tests
        run: python -m pytest -q

      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Frontend production-dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Extension production-dependency audit
        working-directory: browser-extension
        run: npm audit --omit=dev --audit-level=high

      - name: MVP foundation browser workflow
        run: python scripts/test_mvp_foundation_browser.py

      - name: Job intelligence browser workflow
        run: python scripts/test_job_intelligence_browser.py

      - name: Normal-browser CORS/cookie security check
        run: python scripts/test_normal_browser_security.py

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:run

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Committed-range whitespace check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$PR_BASE_SHA"
            git diff --check "${PR_BASE_SHA}...HEAD"
          else
            if [ -z "${PUSH_BEFORE_SHA}" ] || [ "$PUSH_BEFORE_SHA" = "$ZERO" ]; then
              if git rev-parse --verify -q HEAD^ >/dev/null; then
                git diff --check HEAD^...HEAD
              else
                git diff --check "$(git hash-object -t tree /dev/null)" HEAD
              fi
            else
              git fetch --no-tags origin "$PUSH_BEFORE_SHA" || true
              git diff --check "${PUSH_BEFORE_SHA}...${HEAD_SHA}"
            fi
          fi

      - name: Tracked secret and artifact audit
        run: python scripts/check_tracked_secrets.py
