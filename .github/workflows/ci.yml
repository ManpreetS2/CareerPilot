name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run backend tests
        run: python -m pytest -q

      - name: MVP foundation browser workflow
        run: python scripts/test_mvp_foundation_browser.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Committed-range whitespace check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$PR_BASE_SHA"
            git diff --check "${PR_BASE_SHA}...HEAD"
          else
            if [ -z "${PUSH_BEFORE_SHA}" ] || [ "$PUSH_BEFORE_SHA" = "$ZERO" ]; then
              if git rev-parse --verify -q HEAD^ >/dev/null; then
                git diff --check HEAD^...HEAD
              else
                git diff --check "$(git hash-object -t tree /dev/null)" HEAD
              fi
            else
              git fetch --no-tags origin "$PUSH_BEFORE_SHA" || true
              git diff --check "${PUSH_BEFORE_SHA}...${HEAD_SHA}"
            fi
          fi

      - name: Tracked secret and artifact audit
        run: python scripts/check_tracked_secrets.py
