# Full-history secret scan using the official Gitleaks release.
# Findings are redacted. Do not print secret values in logs or summaries.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Full-history Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE: "gitleaks_8.30.1_linux_x64.tar.gz"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -fsSL -o "${GITLEAKS_ARCHIVE}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          echo "${GITLEAKS_SHA256}  ${GITLEAKS_ARCHIVE}" | sha256sum -c -
          tar -xzf "${GITLEAKS_ARCHIVE}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "${GITLEAKS_ARCHIVE}"
          gitleaks version

      - name: Scan full Git history
        env:
          REPORT_PATH: ${{ runner.temp }}/gitleaks-report.json
        run: |
          set -euo pipefail
          gitleaks git \
            --verbose \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format json \
            --report-path "${REPORT_PATH}" \
            --log-opts="--all" \
            .

      - name: Summarize findings without secret values
        if: failure()
        env:
          REPORT_PATH: ${{ runner.temp }}/gitleaks-report.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          path = Path(os.environ["REPORT_PATH"])
          if not path.is_file():
              print("Gitleaks report missing; refusing to print raw scanner output.")
              raise SystemExit(1)
          findings = json.loads(path.read_text(encoding="utf-8") or "[]")
          print(f"Gitleaks findings: {len(findings)} (secret values omitted)")
          counts = Counter()
          for item in findings:
              rule = item.get("RuleID") or item.get("Description") or "unknown"
              file_path = item.get("File") or "unknown"
              commit = (item.get("Commit") or "unknown")[:12]
              counts[rule] += 1
              print(f" - rule={rule} path={file_path} commit={commit}")
          print("By rule:")
          for rule, count in counts.most_common():
              print(f" - {rule}: {count}")
          PY
