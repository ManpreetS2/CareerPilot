<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="CareerPilot — grounded profiles, real job discovery, human-approved application materials. Never auto-submits."
    />
    <title>CareerPilot</title>
    <svg aria-hidden="true" width="0" height="0" style="position: absolute; overflow: hidden">
      <defs>
        <filter id="cp-glass-displace" color-interpolation-filters="sRGB" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="8" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <script>
      (function () {
        try {
          var preference = localStorage.getItem("careerpilot-theme") || "system";
          var dark =
            preference === "dark" ||
            (preference !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var reduce =
            localStorage.getItem("careerpilot-reduced-motion") === "1" ||
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (reduce) document.documentElement.classList.add("reduce-motion");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
