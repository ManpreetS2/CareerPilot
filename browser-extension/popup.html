<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CareerPilot Assisted Apply</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 340px;
        padding: 16px;
        background: #0b1220;
        color: #f2f5fa;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #7e8caa;
        margin: 0 0 12px;
        line-height: 1.45;
      }
      button {
        width: 100%;
        padding: 9px 12px;
        background: #ffb627;
        color: #0b1220;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-size: 13px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        margin-top: 14px;
        font-size: 12px;
        line-height: 1.6;
      }
      .section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: #7e8caa;
        margin: 10px 0 4px;
      }
      .filled-item {
        color: #00d9a3;
      }
      .flagged-item {
        color: #ff5c6c;
      }
      .error {
        color: #ff5c6c;
      }
      ul {
        margin: 0;
        padding-left: 16px;
      }
    </style>
  </head>
  <body>
    <h1>CareerPilot Assisted Apply</h1>
    <p>
      Fills your approved application directly into this page. Runs only on Greenhouse and Lever
      forms, and never clicks submit — review everything, then send it yourself.
    </p>
    <button id="fill-btn" type="button">Fill this page</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
