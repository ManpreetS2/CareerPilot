<!DOCTYPE html>
<html>
<head><title>Apply — Acme Corp</title></head>
<body>
  <form id="application_form">
    <label for="first_name">First Name</label>
    <input type="text" id="first_name" name="job_application[first_name]" required />

    <label for="last_name">Last Name</label>
    <input type="text" id="last_name" name="job_application[last_name]" required />

    <label for="email">Email</label>
    <input type="email" id="email" name="job_application[email]" required />

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="job_application[phone]" />

    <label for="company">Current Company</label>
    <input type="text" id="company" name="job_application[company]" />

    <label for="question_1">Location (City)</label>
    <input type="text" id="question_1" name="job_application[answers][1][text_value]" />

    <label for="question_2">LinkedIn Profile</label>
    <input type="text" id="question_2" name="job_application[answers][2][text_value]" />

    <label for="question_3">GitHub Profile URL</label>
    <input type="text" id="question_3" name="job_application[answers][3][text_value]" />

    <label for="question_4">Legal Name (if different than above)</label>
    <input type="text" id="question_4" name="job_application[answers][4][text_value]" />

    <label for="question_5">Do you now or will you in the future require immigration sponsorship?</label>
    <select id="question_5" name="job_application[answers][5][text_value]" required>
      <option value="">Select...</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <label for="question_6">Are you currently enrolled in a university or program?</label>
    <select id="question_6" name="job_application[answers][6][text_value]">
      <option value="">Select...</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <label for="question_8">Gender</label>
    <select id="question_8" name="job_application[answers][8][text_value]">
      <option value="">Select...</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Decline to self-identify">Decline to self-identify</option>
    </select>

    <label for="resume">Resume/CV</label>
    <input type="file" id="resume" name="job_application[resume]" required />

    <label for="cover_letter_text">Cover Letter</label>
    <textarea id="cover_letter_text" name="job_application[cover_letter_text]"></textarea>

    <label for="how_did_you_hear">How did you hear about us?</label>
    <input type="text" id="how_did_you_hear" name="job_application[answers][0][text_value]" required />

    <label for="privacy_ack">
      Please review and acknowledge the Candidate Privacy Policy
      <input type="checkbox" id="privacy_ack" name="job_application[answers][7][boolean_value]" required />
    </label>

    <button type="submit" id="submit_app">Submit Application</button>
  </form>
</body>
</html>
