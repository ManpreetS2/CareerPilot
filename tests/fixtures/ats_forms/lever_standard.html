<!DOCTYPE html>
<html>
<head><title>Apply — Acme Corp | Lever</title></head>
<body>
  <form class="application-form">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required />

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" />

    <label for="org">Current Company</label>
    <input type="text" id="org" name="org" />

    <label for="urls_portfolio">Portfolio</label>
    <input type="text" id="urls_portfolio" name="urls[Portfolio]" />

    <label for="resume">Resume</label>
    <input type="file" id="resume" name="resume" required />

    <label for="comments">Additional Information</label>
    <textarea id="comments" name="comments"></textarea>

    <label for="custom_question">Why do you want to work here?</label>
    <textarea id="custom_question" name="cards[why]" required></textarea>

    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
