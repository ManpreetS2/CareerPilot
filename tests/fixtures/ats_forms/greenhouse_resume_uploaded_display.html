<!DOCTYPE html>
<html>
<body>
  <!--
    Confirmed live on a real Greenhouse posting: once a resume attaches
    successfully, Greenhouse removes the raw <input type="file"> entirely
    and replaces it with this filename-display widget. verifyResumeAttachmentInPage
    must recognize this as attached, not just check for a live file input.
  -->
  <form id="application_form">
    <div class="file-upload" role="group" aria-labelledby="upload-label-resume" aria-required="true" data-allow-s3="false">
      <div id="upload-label-resume" class="label upload-label">Resume/CV<span class="required">*</span></div>
      <div class="file-upload__wrapper">
        <div class="file-upload__filename">
          <p class="body body__secondary">resume-v1.pdf</p>
        </div>
      </div>
    </div>
    <div class="file-upload" role="group" aria-labelledby="upload-label-cover_letter" aria-required="false">
      <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
      <input type="file" id="cover_letter" name="job_application[cover_letter]" />
    </div>
    <button type="submit" id="submit_app">Submit Application</button>
  </form>
</body>
</html>
